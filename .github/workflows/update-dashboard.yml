name: Update Trend Dashboard

on:
  schedule:
    # UTC 11,12,13,14,15 = Beijing 19,20,21,22,23 共 5 次轮询，仅周一至周五（1-5）。
    # 设计：每天从 19:00 开始每 1 小时主动查一次"接口数据是否更新到当天"，
    # 是当天 + 今天没推过 → 跑完整 fetch+build+push+写 marker；否则 0 成本跳过。
    # 接口数据更新时间不稳定（19:00-23:00 之间任一时间点），轮询避免干等到 23:00。
    # 周末不开盘跳过省 API 费用。
    - cron: '0 11,12,13,14,15 * * 1-5'
  # 允许手动触发（含周末，用于紧急更新）
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: dashboard-update
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    environment: github-pages
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - name: Cache push marker
        # 缓存 .push-marker 文件，记录"今天已推过"日期，防止同一天多次 cron 触发重复推送。
        # cache key 按日期，同一天多次 run 共享同一 cache；新一天会 miss 但 restore-keys 找到前一天的（不影响逻辑，should_run 用 today 比对）。
        uses: actions/cache@v4
        with:
          path: .push-marker
          key: push-marker-${{ github.run_id }}
          restore-keys: |
            push-marker-

      - name: Should run today? (skip if already pushed OR data not yet updated)
        # 主动轮询：先调免费的 getUpdateStatus 看接口数据是否已更新到当天。
        # 接口未更新 → skip=true，所有付费 step 都跳过（0 成本）；
        # 接口已更新 + 今天没推过 → 继续 fetch+build+push；
        # 接口已更新 + 今天已推过 → 也跳过（防重复推送）。
        id: should_run
        env:
          TREND_API_KEY: ${{ secrets.TREND_API_KEY }}
        run: |
          set -eu
          TODAY=$(TZ=Asia/Shanghai date +%Y-%m-%d)
          echo "today(BJ)=$TODAY"

          # 1. 今天已推过就跳过
          if [ -f .push-marker ] && [ "$(cat .push-marker)" = "$TODAY" ]; then
            echo "skip=true" >> $GITHUB_OUTPUT
            echo "🟡 今天 $TODAY 已推过，跳过"
            exit 0
          fi

          # 2. 调 getUpdateStatus 看接口是否更新到当天
          if [ -z "${TREND_API_KEY}" ]; then
            echo "skip=true" >> $GITHUB_OUTPUT
            echo "TREND_API_KEY 未配置，跳过"
            exit 0
          fi
          RESP=$(curl -sS --max-time 15 \
            "https://www.trendtrader.cn/apiData/data/getUpdateStatus?apiKey=${TREND_API_KEY}" \
            -H "User-Agent: trend-dashboard/should-run")
          echo "getUpdateStatus raw: $RESP" | head -c 500
          echo ""
          ASOF=$(echo "$RESP" | python3 -c "
          import sys, json
          try:
              d = json.load(sys.stdin)
              data = d.get('data') or {}
              if isinstance(data, list) and data:
                  data = data[0]
              # 容错多种字段名（asOfDate / asOf / updateDate / date）
              asof = (data.get('asOfDate') or data.get('asOf')
                      or data.get('updateDate') or data.get('date') or '')
              print(asof)
          except Exception:
              print('')
          ")
          echo "接口 asOf=$ASOF"
          if [ "$ASOF" != "$TODAY" ]; then
            echo "skip=true" >> $GITHUB_OUTPUT
            echo "⏸ 接口数据未更新到当天（asOf=$ASOF != today=$TODAY），跳过"
            exit 0
          fi
          echo "skip=false" >> $GITHUB_OUTPUT
          echo "✅ 接口已更新到当天，继续 fetch+build+push"

      - name: Cache weekly boards
        if: steps.should_run.outputs.skip != 'true'
        uses: actions/cache@v4
        with:
          path: dashboard/data/_weekly_boards.json
          key: weekly-boards-${{ github.run_id }}
          restore-keys: |
            weekly-boards-

      - name: Fetch dashboard data
        if: steps.should_run.outputs.skip != 'true'
        env:
          TREND_API_KEY: ${{ secrets.TREND_API_KEY }}
        run: python dashboard/fetch_dashboard_data.py

      - name: Build dashboard
        if: steps.should_run.outputs.skip != 'true'
        run: python dashboard/build_dashboard.py

      - name: Upload Pages artifact
        if: steps.should_run.outputs.skip != 'true'
        uses: actions/upload-pages-artifact@v3
        with:
          path: dashboard/dist

      - name: Deploy to GitHub Pages
        if: steps.should_run.outputs.skip != 'true'
        id: deployment
        uses: actions/deploy-pages@v4

      - name: Push dist to cloudstudio branch (for WorkBuddy auto-deploy)
        if: steps.should_run.outputs.skip != 'true'
        run: |
          cp dashboard/dist/index.html /tmp/index.html
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git fetch origin cloudstudio 2>/dev/null || true
          if git rev-parse --verify origin/cloudstudio >/dev/null 2>&1; then
            git checkout -b cloudstudio origin/cloudstudio
          else
            git checkout --orphan cloudstudio
          fi
          git rm -rf . 2>/dev/null || true
          cp /tmp/index.html .
          git add index.html
          git commit -m "deploy: $(date -u +%Y-%m-%d)" || echo "nothing to commit"
          git push origin cloudstudio --force

      - name: Report
        if: always()
        run: |
          echo "## Dashboard Update Report" >> $GITHUB_STEP_SUMMARY
          if [ -f dashboard/meta.json ]; then
            echo "$(cat dashboard/meta.json)" >> $GITHUB_STEP_SUMMARY
          fi
          if [ -f dashboard/dist/index.html ]; then
            echo "Build OK" >> $GITHUB_STEP_SUMMARY
          else
            echo "Build skipped or FAILED" >> $GITHUB_STEP_SUMMARY
          fi

      - name: Bark Push (only when asOfDate = today)
        # 关键：先校验 meta.json 的 asOfDate 是否为当天。数据未更新到当天 → 静默不推（骄阳指令："没意义就别推"）。
        # 失败也不推（fetch/build 失败时 meta.json 可能不存在或缺字段，自然不进推送分支）。
        # 推送成功后写 .push-marker 文件，cache 会自动保存，防同一天后续 cron 触发重复推送。
        if: ${{ success() && steps.should_run.outputs.skip != 'true' }}
        env:
          BARK_KEY: ${{ secrets.BARK_KEY }}
        run: |
          set -eu
          if [ -z "${BARK_KEY}" ]; then
            echo "BARK_KEY secret 未配置，跳过推送"
            exit 0
          fi
          if [ ! -f dashboard/meta.json ]; then
            echo "meta.json 不存在（fetch 未完成？），跳过推送"
            exit 0
          fi

          python3 <<'PY'
          import json, os, sys, urllib.request, urllib.parse, datetime

          meta = json.loads(open("dashboard/meta.json", encoding="utf-8").read())
          as_of = meta.get("asOfDate", "")
          pools = meta.get("pools", 0)
          cand = meta.get("cand", 0)
          cost = meta.get("cost", 0)
          bal = meta.get("balance", 0)

          # 北京时间今天的日期（runner 默认 UTC，需要手动 +8）
          now_bj = datetime.datetime.utcnow() + datetime.timedelta(hours=8)
          today_bj = now_bj.strftime("%Y-%m-%d")
          print(f"asOfDate={as_of}  today(BJ)={today_bj}")

          if as_of != today_bj:
              print(f"⏸ 数据未更新到当天（asOf={as_of} != today={today_bj}），静默不推")
              sys.exit(0)

          # 已是当天 → 推送
          key = os.environ["BARK_KEY"]
          url = f"https://api.day.app/{key}"
          body = (
              f"日期 {as_of}\n"
              f"持仓 {pools} · 推荐 {cand}\n"
              f"本次成本 ¥{cost} · 余额 ¥{bal}\n"
              f"shinning-niki.github.io/trend-dashboard"
          )
          payload = {
              "title": "📈 趋势看版已更新",
              "body": body,
              "group": "trend-dashboard",
              "ttl": 600,
              "url": "https://shinning-niki.github.io/trend-dashboard/",
          }
          data = urllib.parse.urlencode(payload).encode("utf-8")
          req = urllib.request.Request(url, data=data, method="POST")
          try:
              with urllib.request.urlopen(req, timeout=15) as r:
                  resp = r.read().decode("utf-8", errors="ignore")
              print(f"Bark 推送成功: {resp[:200]}")
              # 推送成功后写 marker，防同一天后续 cron 触发重复推送
              today = now_bj.strftime("%Y-%m-%d")
              with open(".push-marker", "w") as f:
                  f.write(today)
              print(f"已写 .push-marker={today}（cache 会自动保存）")
          except Exception as e:
              print(f"Bark 推送失败: {e}")
              sys.exit(0)  # 推送失败不阻断主流程
          PY
