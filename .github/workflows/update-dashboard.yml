name: Update Trend Dashboard

on:
  schedule:
    # 北京 19:30 / 20:30 / 21:30 共 3 次触发（UTC 11:30 / 12:30 / 13:30）
    # 用非整点（30 分）避开 GitHub Actions 整点高负载合并问题。
    # GitHub Actions 公开仓库 cron 严重延迟（高峰期延迟 6-9 小时甚至跳过），
    # 即使延迟到凌晨跨日，Bark Push 现在用 asOfDate 比较逻辑也能正确推送。
    # 周末不开盘跳过省 API 费用。
    - cron: '30 11,12,13 * * 1-5'
  # 允许手动触发（含周末，用于紧急更新）
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: dashboard-update
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    environment: github-pages
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - name: Cache push marker
        # .push-marker 记录上次推送的 asOfDate（不是 today）
        # Bark Push step 比较 asOf > last_pushed 才推
        uses: actions/cache@v4
        with:
          path: .push-marker
          key: push-marker-${{ github.run_id }}
          restore-keys: |
            push-marker-

      - name: Should fetch? (always run unless skip flag set)
        # fetch 总是跑，确保看板总更新到最新交易日数据
        # 真正的去重判定在 Bark Push step（基于 asOfDate 比较）
        id: should_run
        run: |
          echo "skip=false" >> $GITHUB_OUTPUT
          echo "✅ 继续访+build+deploy（去重判定在 Bark Push step）"

      - name: Cache weekly boards
        if: steps.should_run.outputs.skip != 'true'
        uses: actions/cache@v4
        with:
          path: dashboard/data/_weekly_boards.json
          key: weekly-boards-${{ github.run_id }}
          restore-keys: |
            weekly-boards-

      - name: Fetch dashboard data
        if: steps.should_run.outputs.skip != 'true'
        env:
          TREND_API_KEY: ${{ secrets.TREND_API_KEY }}
        run: python dashboard/fetch_dashboard_data.py

      - name: Build dashboard
        if: steps.should_run.outputs.skip != 'true'
        run: python dashboard/build_dashboard.py

      - name: Upload Pages artifact
        if: steps.should_run.outputs.skip != 'true'
        uses: actions/upload-pages-artifact@v3
        with:
          path: dashboard/dist

      - name: Deploy to GitHub Pages
        if: steps.should_run.outputs.skip != 'true'
        id: deployment
        uses: actions/deploy-pages@v4

      - name: Push dist to cloudstudio branch (for WorkBuddy auto-deploy)
        if: steps.should_run.outputs.skip != 'true'
        run: |
          cp dashboard/dist/index.html /tmp/index.html
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git fetch origin cloudstudio 2>/dev/null || true
          if git rev-parse --verify origin/cloudstudio >/dev/null 2>&1; then
            git checkout -b cloudstudio origin/cloudstudio
          else
            git checkout --orphan cloudstudio
          fi
          git rm -rf . 2>/dev/null || true
          cp /tmp/index.html .
          git add index.html
          git commit -m "deploy: $(date -u +%Y-%m-%d)" || echo "nothing to commit"
          git push origin cloudstudio --force

      - name: Report
        if: always()
        run: |
          echo "## Dashboard Update Report" >> $GITHUB_STEP_SUMMARY
          if [ -f dashboard/meta.json ]; then
            echo "$(cat dashboard/meta.json)" >> $GITHUB_STEP_SUMMARY
          fi
          if [ -f dashboard/dist/index.html ]; then
            echo "Build OK" >> $GITHUB_STEP_SUMMARY
          else
            echo "Build skipped or FAILED" >> $GITHUB_STEP_SUMMARY
          fi

      - name: Bark Push (when asOfDate newer than last pushed)
        # 推送判定：asOfDate > .push-marker(上次推送的 asOfDate) 才推
        # 这解决了 GitHub Actions cron 凌晨跨日触发的问题：
        #   - 凌晨跨日触发：asOf=11/5（昨天），marker=11/4（前天），asOf>marker → 推送 ✅
        #   - 同一天重复 cro​​en：asOf 不变，marker==asOf → 跳过 ✅
        #   - 接口没更新：asOf 还是昨天的，marker 也是昨天的 → 跳过 ✅
        if: ${{ success() && steps.should_run.outputs.skip != 'true' }}
        env:
          BARK_KEY: ${{ secrets.BARK_KEY }}
        run: |
          set -eu
          if [ -z "${BARK_KEY}" ]; then
            echo "BARK_KEY secret 未配置，跳过推送"
            exit 0
          fi
          if [ ! -f dashboard/meta.json ]; then
            echo "meta.json 不存在（fetch 未完成？），跳过推送"
            exit 0
          fi

          python3 <<'PY'
          import json, os, sys, urllib.request, urllib.parse, datetime

          meta = json.loads(open("dashboard/meta.json", encoding="utf-8").read())
          as_of = meta.get("asOfDate", "")
          pools = meta.get("pools", 0)
          cand = meta.get("cand", 0)
          cost = meta.get("cost", 0)
          bal = meta.get("balance", 0)

          # 读上次推送的 asOfDate（marker 文件存的是 asOfDate，不是 today）
          last_pushed = ""
          try:
              with open(".push-marker") as f:
                  last_pushed = f.read().strip()
          except FileNotFoundError:
              pass

          now_bj = datetime.datetime.utcnow() + datetime.timedelta(hours=8)
          print(f"asOfDate={as_of}  last_pushed={last_pushed}  now(BJ)={now_bj.strftime('%Y-%m-%d %H:%M')}")

          if not as_of:
              print("⏸ asOfDate 为空，跳过推送")
              sys.exit(0)
          if last_pushed and as_of <= last_pushed:
              print(f"⏸ asOf({as_of}) <= last_pushed({last_pushed})，已推过这个数据日期，跳过")
              sys.exit(0)

          key = os.environ["BARK_KEY"]
          url = f"https://api.day.app/{key}"
          body = (
              f"日期 {as_of}\n"
              f"持仓 {pools} · 推荐 {cand}\n"
              f"本次成本 ¥{cost} · 余额 ¥{bal}\n"
              f"shinning-niki.github.io/trend-dashboard"
          )
          payload = {
              "title": "📈 趋势看版已更新",
              "body": body,
              "group": "trend-dashboard",
              "ttl": 600,
              "url": "https://shinning-niki.github.io/trend-dashboard/",
          }
          data = urllib.parse.urlencode(payload).encode("utf-8")
          req = urllib.request.Request(url, data=data, method="POST")
          try:
              with urllib.request.urlopen(req, timeout=15) as r:
                  resp = r.read().decode("utf-8", errors="ignore")
              print(f"Bark 推送成功: {resp[:200]}")
              # marker 写入本次推送的 asOfDate（不是 today）
              with open(".push-marker", "w") as f:
                  f.write(as_of)
              print(f"已写 .push-marker={as_of}（cache 会自动保存）")
          except Exception as e:
              print(f"Bark 推送失败: {e}")
              sys.exit(0)
          PY