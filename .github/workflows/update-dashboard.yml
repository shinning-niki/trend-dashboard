name: Update Trend Dashboard

on:
  schedule:
    # UTC 22:00 = Beijing 06:00，仅周一至周五（1-5）；周末A股/ETF不开盘，数据不变，跳过省API费用
    - cron: '0 22 * * 1-5'
  # 允许手动触发（含周末，用于紧急更新）
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: dashboard-update
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    environment: github-pages
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - name: Cache weekly boards
        uses: actions/cache@v4
        with:
          path: dashboard/data/_weekly_boards.json
          key: weekly-boards-${{ github.run_id }}
          restore-keys: |
            weekly-boards-

      - name: Fetch dashboard data
        env:
          TREND_API_KEY: ${{ secrets.TREND_API_KEY }}
        run: python dashboard/fetch_dashboard_data.py

      - name: Build dashboard
        run: python dashboard/build_dashboard.py

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: dashboard/dist

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

      - name: Push dist to cloudstudio branch (for WorkBuddy auto-deploy)
        run: |
          cp dashboard/dist/index.html /tmp/index.html
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git fetch origin cloudstudio 2>/dev/null || true
          if git rev-parse --verify origin/cloudstudio >/dev/null 2>&1; then
            git checkout -b cloudstudio origin/cloudstudio
          else
            git checkout --orphan cloudstudio
          fi
          git rm -rf . 2>/dev/null || true
          cp /tmp/index.html .
          git add index.html
          git commit -m "deploy: $(date -u +%Y-%m-%d)" || echo "nothing to commit"
          git push origin cloudstudio --force

      - name: Report
        if: always()
        run: |
          echo "## Dashboard Update Report" >> $GITHUB_STEP_SUMMARY
          echo "$(cat dashboard/meta.json)" >> $GITHUB_STEP_SUMMARY
          if [ -f dashboard/dist/index.html ]; then
            echo "Build OK" >> $GITHUB_STEP_SUMMARY
          else
            echo "Build FAILED" >> $GITHUB_STEP_SUMMARY
            exit 1
          fi
